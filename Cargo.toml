[workspace]
resolver = "2"
members = ["crates/tracker-core", "crates/tracker-cli", "crates/tracker-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
lto = "thin"
strip = true
